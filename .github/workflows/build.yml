name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.0.33)'
        required: false
        default: ''

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'. Expected a semantic version such as 0.0.16 or 0.0.17-rc.1."
            exit 1
          fi

          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building version $VERSION (versionCode/buildNumber $VERSION_CODE)"

  build-android:
    name: Build Android (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            name: arm64-v8a
            profile: preview-arm64
          - arch: armeabi-v7a
            name: armeabi-v7a
            profile: preview-armeabi
          - arch: x86_64
            name: x86_64
            profile: preview-x86_64
          - arch: universal
            name: universal
            profile: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: bun install

      - name: Install Expo CLI and EAS CLI
        run: bun add -g expo-cli eas-cli

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Keystore
        run: |
          mkdir -p credentials
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > credentials/keystore.jks

      - name: Create credentials.json
        run: |
          cat > credentials.json << EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/keystore.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Verify resolved Expo version
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          npx expo config --type public --json > /tmp/expo-config.json
          jq '{version, androidVersionCode: .android.versionCode, iosBuildNumber: .ios.buildNumber}' /tmp/expo-config.json
          test "$(jq -r '.version' /tmp/expo-config.json)" = "$APP_VERSION"
          test "$(jq -r '.android.versionCode' /tmp/expo-config.json)" = "$APP_VERSION_CODE"
          test "$(jq -r '.ios.buildNumber' /tmp/expo-config.json)" = "$APP_VERSION_CODE"

      - name: Build Android APK (${{ matrix.name }})
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          mkdir -p build
          OUTPUT_APK="./build/paperand-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.apk"
          eas build --platform android --profile ${{ matrix.profile }} --local --non-interactive --output "$OUTPUT_APK"
          if [ "${{ matrix.arch }}" == "universal" ]; then
            cp "$OUTPUT_APK" "./build/paperand-${{ needs.prepare.outputs.version }}.apk"
          fi

      - name: Upload Android APK Artifact (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.arch }}
          path: ./build/*.apk
          retention-days: 30

  fetch-ios:
    name: Fetch iOS from Codemagic
    runs-on: ubuntu-latest
    needs: [prepare]
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      ipa_downloaded: ${{ steps.download.outputs.downloaded }}
    steps:
      - name: Download IPA from Codemagic
        id: download
        env:
          CODEMAGIC_TOKEN: ${{ secrets.CODEMAGIC_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"
          
          echo "Looking for Codemagic build with tag: $TAG"
          
          # Get builds for this app and find the one matching our tag
          BUILDS=$(curl -s -H "x-auth-token: $CODEMAGIC_TOKEN" \
            "https://api.codemagic.io/builds?appId=$CODEMAGIC_APP_ID")
          
          # Find build that matches our tag
          BUILD_INFO=$(echo "$BUILDS" | jq --arg tag "$TAG" '[.builds[] | select(.tag == $tag)] | .[0]')
          BUILD_ID=$(echo "$BUILD_INFO" | jq -r '._id // empty')
          BUILD_STATUS=$(echo "$BUILD_INFO" | jq -r '.status // empty')
          
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" == "null" ]; then
            echo "No build found for tag $TAG, checking latest builds..."
            BUILD_ID=$(echo "$BUILDS" | jq -r '.builds[0]._id')
            BUILD_STATUS=$(echo "$BUILDS" | jq -r '.builds[0].status')
          fi
          
          echo "Build ID: $BUILD_ID, Status: $BUILD_STATUS"
          
          # Wait if still building (max 25 minutes)
          for i in {1..50}; do
            if [ "$BUILD_STATUS" == "finished" ]; then
              break
            fi
            echo "Build still $BUILD_STATUS, waiting 30s ($i/50)..."
            sleep 30
            BUILD_RESPONSE=$(curl -s -H "x-auth-token: $CODEMAGIC_TOKEN" \
              "https://api.codemagic.io/builds/$BUILD_ID")
            BUILD_STATUS=$(echo "$BUILD_RESPONSE" | jq -r '.build.status // .status')
          done
          
          if [ "$BUILD_STATUS" != "finished" ]; then
            echo "Build did not finish in time"
            echo "downloaded=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Re-fetch build to get artifacts
          BUILD_RESPONSE=$(curl -s -H "x-auth-token: $CODEMAGIC_TOKEN" \
            "https://api.codemagic.io/builds/$BUILD_ID")
          
          # Get artifact URL from build response
          ARTIFACT_URL=$(echo "$BUILD_RESPONSE" | jq -r '.build.artefacts[0].url // .artefacts[0].url // empty')
          
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No artifact found in build $BUILD_ID"
            echo "downloaded=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Downloading IPA from: $ARTIFACT_URL"
          mkdir -p release
          curl -L -H "x-auth-token: $CODEMAGIC_TOKEN" -o "release/paperand-${VERSION}.ipa" "$ARTIFACT_URL"
          
          if [ -f "release/paperand-${VERSION}.ipa" ]; then
            echo "downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "downloaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload iOS Artifact
        if: steps.download.outputs.downloaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ./release/*.ipa
          retention-days: 30

  release:
    name: Create Release
    needs: [prepare, build-android, fetch-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-apk-*
          path: ./release
          merge-multiple: true

      - name: Download iOS Artifact
        if: needs.fetch-ios.outputs.ipa_downloaded == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./release
        continue-on-error: true

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_BADGE="${VERSION//-/--}"
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD 2>/dev/null || echo "- Initial release")
          else
            COMMITS="- Initial release"
          fi
          
          cat > release_notes.md << 'NOTES_EOF'
          <div align="center">
          
          # 📱 Paperand vVERSION_PLACEHOLDER
          
          ### _Ad-Free Manga Reader for iOS & Android_
          
          <img src="https://img.shields.io/badge/version-VERSION_BADGE_PLACEHOLDER-blue?style=for-the-badge" alt="Version"/>
          <img src="https://img.shields.io/badge/platform-iOS%20%7C%20Android-green?style=for-the-badge" alt="Platform"/>
          <img src="https://img.shields.io/badge/built%20with-Expo-4630EB?style=for-the-badge" alt="Built with Expo"/>
          
          </div>
          
          ---
          
          ## ✨ What's New
          
          NOTES_EOF
          
          echo "$COMMITS" >> release_notes.md
          
          cat >> release_notes.md << 'NOTES_EOF'
          
          ---
          
          ## 📥 Downloads
          
          ### 🤖 Android (Device Architecture Builds)
          
          > 💡 **Tip:** Most modern Android phones & tablets use **arm64-v8a**. Downloading the specific architecture APK drastically reduces download size and disk usage!
          
          | Architecture | Target Device | Download File | Estimated Size |
          |---|---|---|---|
          | ⚡ **arm64-v8a** *(Recommended)* | Modern phones & tablets (64-bit ARM) | `paperand-VERSION_PLACEHOLDER-arm64-v8a.apk` | **~25 MB** (Smallest) |
          | 📱 **armeabi-v7a** | Older & budget phones (32-bit ARM) | `paperand-VERSION_PLACEHOLDER-armeabi-v7a.apk` | **~22 MB** |
          | 💻 **x86_64** | Emulators, PC, Chromebooks | `paperand-VERSION_PLACEHOLDER-x86_64.apk` | **~28 MB** |
          | 🌐 **Universal** | All Android devices | `paperand-VERSION_PLACEHOLDER-universal.apk` / `paperand-VERSION_PLACEHOLDER.apk` | ~70 MB |
          
          ### 🍎 iOS
          | Platform | File | Installation |
          |---|---|---|
          | 🍎 **iOS** | `paperand-VERSION_PLACEHOLDER.ipa` | Sideload with AltStore / Sideloadly / TrollStore |
          
          ---
          
          <div align="center">
          
          **Made with ❤️ by chiraitori**
          
          </div>
          NOTES_EOF

          sed -i "s/VERSION_BADGE_PLACEHOLDER/$VERSION_BADGE/g" release_notes.md
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: 📱 Paperand v${{ needs.prepare.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'rc') || contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'beta') }}
          files: |
            ./release/*.apk
            ./release/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
